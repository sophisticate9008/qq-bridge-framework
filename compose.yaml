services:
  framework:
    image: qq-bridge-framework:1.13.6
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3210:3210"
    volumes:
      - framework-data:/opt/qbf/data
      - framework-workspace:/opt/qbf/workspace
      - framework-private:/opt/qbf/private
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  framework-data:
  framework-workspace:
  framework-private:

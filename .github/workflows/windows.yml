name: Windows 启动包验证
run-name: Windows 候选包 ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      source_only:
        description: 仅诊断 Windows 源码聊天链路，不构建或验收安装包
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  html-renderer:
    if: ${{ !inputs.source_only }}
    uses: ./.github/workflows/html-renderer.yml
  source:
    name: Windows 源码链路诊断
    if: inputs.source_only
    runs-on: windows-2022
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.12.0'
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - run: node --test test/windows-file-security.test.ts
      - run: node --test --test-name-pattern='real local WS text passes through native host' test/native-chat-runtime.test.ts
  package:
    needs: html-renderer
    if: ${{ !inputs.source_only }}
    name: 云端构建完整候选包
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.12.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: html-renderer-*
          path: runtime/html-renderer-components
      - run: node scripts/install-html-renderer.ts runtime/html-renderer-components --all
      - run: npm ci --prefix packages/dsh-bridge-plugin --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run build:sdk
      - run: npm --prefix packages/dsh-bridge-plugin run build
      - run: npm run release:pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-candidate-packages
          path: runtime/releases/
          if-no-files-found: error
          retention-days: 7
  install:
    name: 原生验收 ${{ matrix.platform }}-${{ matrix.arch }}
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2022, platform: win32, arch: x64}
          - {runner: ubuntu-24.04, platform: linux, arch: x64}
          - {runner: ubuntu-24.04-arm, platform: linux, arch: arm64}
    defaults:
      run:
        shell: bash
    env:
      QQ_BRIDGE_FRAMEWORK_RELEASE_PLATFORM: ${{ matrix.platform }}
      QQ_BRIDGE_FRAMEWORK_RELEASE_ARCH: ${{ matrix.arch }}
      QQ_BRIDGE_FRAMEWORK_RELEASE_SOURCE_COMMIT: ${{ github.sha }}
      QQ_BRIDGE_FRAMEWORK_RELEASE_REPORT: platform-result.json
      QQ_BRIDGE_FRAMEWORK_RELEASE_WINDOWS_SMOKE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.12.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-candidate-packages
          path: runtime/releases
      - name: 安装与启动同一候选包
        run: node scripts/verify-framework-release.ts 2>&1 | tee platform-verification.log
      - name: 保存验收报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-candidate-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            platform-result.json
            platform-verification.log
          if-no-files-found: ignore
          retention-days: 3

name: 发行包安装验证

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  html-renderer:
    uses: ./.github/workflows/html-renderer.yml
  package:
    needs: html-renderer
    name: 完整框架包安装与启动
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.12.0'
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: html-renderer-*
          path: runtime/html-renderer-components
      - run: node scripts/install-html-renderer.ts runtime/html-renderer-components --all
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix packages/dsh-bridge-plugin --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run build:sdk
      - run: npm --prefix packages/dsh-bridge-plugin run build
      - name: 核验实际 DSH SDK 插件入口
        run: node --test packages/dsh-bridge-plugin/test/sdk-entry.test.ts
      - run: npm run release:pack
      - name: 全新目录安装、控制台资源、原生渲染与重启
        run: npm run test:release
      - name: 保存经过安装验证的发行包
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-packages
          path: runtime/releases/
          if-no-files-found: error
          retention-days: 7
  native:
    name: 发行包原生安装 ${{ matrix.platform }}-${{ matrix.arch }}
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2022, platform: win32, arch: x64}
          - {runner: ubuntu-24.04-arm, platform: linux, arch: arm64}
    defaults:
      run:
        shell: bash
    env:
      QQ_BRIDGE_FRAMEWORK_RELEASE_PLATFORM: ${{ matrix.platform }}
      QQ_BRIDGE_FRAMEWORK_RELEASE_ARCH: ${{ matrix.arch }}
      QQ_BRIDGE_FRAMEWORK_RELEASE_SOURCE_COMMIT: ${{ github.sha }}
      QQ_BRIDGE_FRAMEWORK_RELEASE_REPORT: platform-result.json
      QQ_BRIDGE_FRAMEWORK_RELEASE_WINDOWS_SMOKE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.12.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-packages
          path: runtime/releases
      - name: 验证同批正式附件
        run: node scripts/verify-framework-release.ts 2>&1 | tee platform-verification.log
      - name: 保存小型平台验收报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-platform-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            platform-result.json
            platform-verification.log
          if-no-files-found: ignore
          retention-days: 3

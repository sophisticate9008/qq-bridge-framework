name: 发行包安装验证

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  html-renderer:
    uses: ./.github/workflows/html-renderer.yml
  package:
    needs: html-renderer
    name: 完整框架包安装与启动
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.12.0'
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: html-renderer-*
          path: private/maintenance/html-renderer-components
      - run: node scripts/install-html-renderer.ts private/maintenance/html-renderer-components --all
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix packages/dsh-bridge-plugin --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run build:sdk
      - run: npm --prefix packages/dsh-bridge-plugin run build
      - name: 核验实际 DSH SDK 插件入口
        run: node --test packages/dsh-bridge-plugin/test/sdk-entry.test.ts
      - run: npm run release:pack
      - name: 全新目录安装、控制台资源、原生渲染与重启
        run: npm run test:release
      - name: 同批桥接组件原生附件路径与私有存储
        run: node scripts/verify-work-path-release.ts
      - name: 保存经过安装验证的发行包
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: framework-packages
          path: private/maintenance/releases/
          if-no-files-found: error
          retention-days: 7
  native:
    name: 发行包原生安装 ${{ matrix.platform }}-${{ matrix.arch }}
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2022, platform: win32, arch: x64}
          - {runner: ubuntu-24.04-arm, platform: linux, arch: arm64}
    defaults:
      run:
        shell: bash
    env:
      QQ_BRIDGE_FRAMEWORK_RELEASE_PLATFORM: ${{ matrix.platform }}
      QQ_BRIDGE_FRAMEWORK_RELEASE_ARCH: ${{ matrix.arch }}
      QQ_BRIDGE_FRAMEWORK_RELEASE_SOURCE_COMMIT: ${{ github.sha }}
      QQ_BRIDGE_FRAMEWORK_RELEASE_REPORT: platform-result.json
      QQ_BRIDGE_FRAMEWORK_RELEASE_WINDOWS_SMOKE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.12.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: framework-packages
          path: private/maintenance/releases
      - name: 验证同批正式附件
        run: node scripts/verify-framework-release.ts 2>&1 | tee platform-verification.log
      - name: 同批桥接组件原生附件路径与私有存储
        run: node scripts/verify-work-path-release.ts 2>&1 | tee work-path-platform.log
      - name: 保存小型平台验收报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-platform-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            platform-result.json
            platform-verification.log
            work-path-platform-result.json
            work-path-platform.log
          if-no-files-found: ignore
          retention-days: 3

  docker:
    name: Docker 原生验收 ${{ matrix.arch }}
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.12.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: framework-packages
          path: private/maintenance/releases
      - name: 实际启动、原生排版、停止与持久卷复用
        run: node scripts/verify-docker.ts
      - name: 导出已验证镜像
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          mkdir -p private/maintenance/docker-images
          docker save "qq-bridge-framework:$version" | gzip > "private/maintenance/docker-images/qq-bridge-framework-$version-docker-${{ matrix.arch }}.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: docker-image-${{ matrix.arch }}
          path: private/maintenance/docker-images/*.tar.gz
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: 保存容器验收报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: docker-report-${{ matrix.arch }}
          path: |
            docker-result.json
            docker-runtime.log
          retention-days: 3
          if-no-files-found: ignore
  bundle:
    name: 汇总已验证发行附件
    needs: [package, native, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: framework-packages
          path: private/maintenance/releases
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: docker-image-*
          path: private/maintenance/docker-images
          merge-multiple: true
      - name: 添加镜像校验和
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          cp private/maintenance/docker-images/*.tar.gz "private/maintenance/releases/v$version/"
          cd "private/maintenance/releases/v$version"
          sha256sum *-docker-*.tar.gz >> SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-packages
          path: private/maintenance/releases
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
